services:
  db:
    image: postgres:16-alpine
    container_name: recoverai-db
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai_password
      POSTGRES_DB: recoverai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai -d recoverai_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
